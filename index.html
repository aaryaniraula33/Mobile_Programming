<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h2>Student Result Calculator</h2>

    <input type="text" id="name" placeholder="Enter Student Name"><br><br>

    <input type="number" id="math" placeholder="Basic Math Marks"><br><br>
    <input type="number" id="science" placeholder="Science Marks"><br><br>
    <input type="number" id="english" placeholder="English Marks"><br><br>
    <input type="number" id="social" placeholder="Social Studies Marks"><br><br>
    <input type="number" id="economics" placeholder="Economics Marks"><br><br>
    <input type="number" id="businessMath" placeholder="Business Mathematics Marks"><br><br>
    <input type="number" id="accounts" placeholder="Accounts Marks"><br><br>
    <input type="number" id="nepali" placeholder="Nepali Marks"><br><br>

    <button onclick="calculateResult()">Calculate Result</button>

    <p id="total"></p>
    <p id="percentage"></p>
    <p id="result"></p>
</div>

<script src="script.js"></script>
</body>
</html>

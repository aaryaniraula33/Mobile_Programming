<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile - Aarya Niraula</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<style>
body {
    text-align: center;
    background: #fdf0f5;
    font-family: Arial;
}

.main {
    width: 80%;
    margin: auto;
}

#profile-card {
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    background: #f3e5f5;
    transition: 0.3s;
}

/* FIX BULLET */
ul {
    list-style-position: inside;
    padding-left: 0;
}

/* IMAGE FIX FOR ROUND */
#profile-photo {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

/* CLASSES */
.highlight {
    background-color: #ffd6e0 !important;
}

.dark-mode {
    background-color: #1e1e2f !important;
    color: white !important;
}

.rounded {
    border-radius: 50% !important;
}

.shadow {
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
}

/* BUTTONS */
button {
    margin: 5px;
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: #e0bbff;
    cursor: pointer;
}

button:hover {
    background: #ffc8dd;
}
</style>

<script>
$(document).ready(function () {

    // GET & SET
    $("#show-name").click(function () {
        $("#output").text("Name: " + $("#student-name").text());
    });

    $("#change-name").click(function () {
        $("#student-name").text("Aarya Niraula");
    });

    $("#show-bio").click(function () {
        $("#output").html($("#student-bio").html());
    });

    $("#get-input").click(function () {
        $("#output").text($("#nickname-input").val());
    });

    $("#set-input").click(function () {
        $("#nickname-input").val("jQuery Pro");
    });

    // CSS CLASSES
    $("#highlight").click(function () {
        $("#profile-card")
            .removeClass("dark-mode")
            .addClass("highlight");
    });

    $("#remove-highlight").click(function () {
        $("#profile-card").removeClass("highlight");
    });

    $("#toggle-dark").click(function () {
        $("#profile-card")
            .removeClass("highlight")
            .toggleClass("dark-mode");
    });

    $("#toggle-rounded").click(function () {
        $("#profile-photo").toggleClass("rounded");
    });

    // CSS METHOD
    $("#red-bg").click(function () {
        $("#profile-card")
            .removeClass("dark-mode highlight")
            .css("background-color", "red");
    });

    $("#reset-bg").click(function () {
        $("#profile-card")
            .removeClass("dark-mode highlight")
            .css("background-color", "#f3e5f5");
    });

    // HIDE & SHOW
    $("#hide-photo").click(function () {
        $("#profile-photo").stop(true,true).hide("slow");
    });

    $("#show-photo").click(function () {
        $("#profile-photo").stop(true,true).show("slow");
    });

    $("#toggle-photo").click(function () {
        $("#profile-photo").stop(true,true).toggle("slow");
    });

    // FADE
    $("#fade-out").click(function () {
        $("#profile-photo").stop(true,true).fadeOut("slow");
    });

    $("#fade-in").click(function () {
        $("#profile-photo").stop(true,true).fadeIn("slow");
    });

    $("#fade50").click(function () {
        $("#profile-photo").stop(true,true).fadeIn().fadeTo("slow", 0.5);
    });

    // SLIDE
    $("#slide-up").click(function () {
        $("#skills-list").stop(true,true).slideUp("slow");
    });

    $("#slide-down").click(function () {
        $("#skills-list").stop(true,true).slideDown("slow");
    });

    $("#slide-toggle").click(function () {
        $("#skills-list").stop(true,true).slideToggle("slow");
    });

    // ANIMATE
    $("#animate").click(function () {
        $("#profile-photo")
            .stop(true,true)
            .show()
            .animate({marginLeft: '200px'}, 1000)
            .animate({marginLeft: '0px'}, 1000);
    });

    // EVENTS
    $("#profile-photo").hover(
        function(){ $(this).addClass("shadow"); },
        function(){ $(this).removeClass("shadow"); }
    );

    $("#nickname-input").keyup(function(e){
        $("#output").text("Key: " + e.key);
    });

});
</script>
</head>

<body>

<h2>Profile Card</h2>

<div class="main">

<div id="profile-card">
    <h3 id="student-name">Aarya Niraula</h3>

    <img id="profile-photo" src="image.jpg">

    <p id="student-bio">
        <b>Student</b> learning jQuery.
    </p>

    <ul id="skills-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>jQuery</li>
    </ul>
</div>

<input type="text" id="nickname-input">
<p id="output">Output here</p>

<h3>GET & SET</h3>
<button id="show-name">Show Name</button>
<button id="change-name">Change Name</button>
<button id="show-bio">Show Bio</button>
<button id="get-input">Get Input</button>
<button id="set-input">Set Input</button>

<h3>CSS Classes</h3>
<button id="highlight">Highlight</button>
<button id="remove-highlight">Remove Highlight</button>
<button id="toggle-dark">Dark Mode</button>
<button id="toggle-rounded">Rounded</button>

<h3>CSS Method</h3>
<button id="red-bg">Red Background</button>
<button id="reset-bg">Reset Background</button>

<h3>Hide & Show</h3>
<button id="hide-photo">Hide Photo</button>
<button id="show-photo">Show Photo</button>
<button id="toggle-photo">Toggle Photo</button>

<h3>Fade</h3>
<button id="fade-out">Fade Out</button>
<button id="fade-in">Fade In</button>
<button id="fade50">Fade 50%</button>

<h3>Slide</h3>
<button id="slide-up">Slide Up</button>
<button id="slide-down">Slide Down</button>
<button id="slide-toggle">Slide Toggle</button>

<h3>Animate</h3>
<button id="animate">Animate</button>

</div>

</body>
</html>
